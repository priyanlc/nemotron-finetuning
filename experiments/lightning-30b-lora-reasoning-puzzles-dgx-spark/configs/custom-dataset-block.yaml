# Appended to a copy of nemotron_nano_v3_5_lightning_singlegpu_lora.yaml after its HellaSwag `dataset:` block has
# been deleted (README.md, step 7). Trains on the JSONL files that data/make_puzzle_jsonl.py writes, with the
# tokenizer's chat template, the loss on the assistant turn only, and validation on val.jsonl.
# `split` is ignored for local files, which always load as a single split.
# Not yet run on the Lightning recipe: the decode check and the 20-step run of step 8 come first.

dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /shared/nemotron-finetuning/experiments/lightning-30b-lora-reasoning-puzzles-dgx-spark/data/train.jsonl
  split: train
  column_mapping:
    question: prompt
    answer: completion
  use_hf_chat_template: true
  answer_only_loss_mask: true
  seq_length: 2048
  padding: do_not_pad
  truncation: longest_first

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /shared/nemotron-finetuning/experiments/lightning-30b-lora-reasoning-puzzles-dgx-spark/data/val.jsonl
  split: train
  column_mapping:
    question: prompt
    answer: completion
  use_hf_chat_template: true
  answer_only_loss_mask: true
  seq_length: 2048
  padding: do_not_pad
  truncation: longest_first

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
