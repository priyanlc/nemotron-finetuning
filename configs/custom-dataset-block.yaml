# Replace the recipe's `dataset:` and `validation_dataset:` blocks with these two to
# train on your own JSONL prompt/completion pairs (README, "Next step").
# Each line of a file: {"prompt": "...", "completion": "..."}.
# `split` is ignored for local files, which always load as a single split.
# By default (use_hf_chat_template: false) each example is plain text: prompt + completion, nothing in between.
# Untested on the Lightning recipe so far: run 20 steps first.

dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /shared/data/train.jsonl
  split: train
  column_mapping:
    question: prompt
    answer: completion
  seq_length: 2048
  answer_only_loss_mask: true
  padding: do_not_pad
  truncation: longest_first

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /shared/data/val.jsonl
  split: train
  column_mapping:
    question: prompt
    answer: completion
  seq_length: 2048
  answer_only_loss_mask: true
  padding: do_not_pad
  truncation: longest_first
